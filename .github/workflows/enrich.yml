# Finds sponsors' websites, careers pages and open roles, and refreshes job lists.
# Companies people view or watch are queued first; the rest are worked through in the background.
name: Enrich sponsors

on:
  schedule:
    # Every 4 hours, offset from the register import.
    - cron: '40 1-23/4 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Which database
        type: choice
        options: [production, staging]
        default: production
      limit:
        description: Sponsors to check this run
        default: '150'

concurrency:
  group: enrich-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.target || 'production') == 'production' && 'main' || 'staging' }}

      - name: Select production or staging settings
        env:
          TARGET: ${{ inputs.target || 'production' }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_BETTER_AUTH_SECRET: ${{ secrets.PROD_BETTER_AUTH_SECRET }}
          PROD_SITE_URL: ${{ vars.PROD_SITE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_BETTER_AUTH_SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
          STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL }}
        run: |
          if [ "$TARGET" = production ]; then P=PROD; else P=STAGING; fi
          db_var="${P}_DATABASE_URL"; secret_var="${P}_BETTER_AUTH_SECRET"; url_var="${P}_SITE_URL"
          if [ -z "${!db_var}" ]; then echo "::error::$db_var secret is empty in this run (run the Check settings workflow)"; exit 1; fi
          echo "DATABASE_URL=${!db_var}" >> "$GITHUB_ENV"
          # Optional: used to refresh company pages on the website as soon as results are saved.
          if [ -n "${!secret_var}" ] && [ -n "${!url_var}" ]; then
            echo "BETTER_AUTH_SECRET=${!secret_var}" >> "$GITHUB_ENV"
            echo "SITE_URL=${!url_var}" >> "$GITHUB_ENV"
          else
            echo "::warning::$secret_var or $url_var not set: pages will update on their normal hourly cache instead of instantly."
          fi
          echo "Target: $TARGET"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Find websites, careers pages and jobs
        env:
          # Optional but recommended: much better website matching. Free key from
          # https://developer.company-information.service.gov.uk/
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: npm run enrich -w worker -- --limit ${{ inputs.limit || '150' }} --concurrency 8
