# Applies new database migrations to production as soon as code lands on main,
# so the schema is ready when Vercel finishes deploying the new site.
name: Migrate production database

on:
  push:
    branches: [main]
    paths: ['packages/db/drizzle/**']
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check secret
        run: test -n "$DATABASE_URL" || { echo "::error::PROD_DATABASE_URL secret is not set"; exit 1; }
      - run: npm ci
      - run: npm run db:migrate
